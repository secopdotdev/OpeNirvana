# nextcloud-spreed-signaling — High-Performance Backend signaling server.
# Rendered from templates/ by docker-host-config.sh configure_hpb().
# Edit templates/spreed-signaling/server.conf, then re-run docker-host-config.sh.

[http]
listen = 0.0.0.0:8080

[app]
# Toggle to true temporarily to diagnose hello / backend-auth failures.
# debug = true

[sessions]
# 64 hex chars used as raw HMAC-SHA256 key bytes — any length is valid.
# Generated by gen-secrets.sh — do not change after first run.
hashkey = ${NC_HPB_HASH_KEY}
# Exactly 32 printable chars (32 bytes) for AES-256 session encryption.
# Must NOT be hex-encoded — spreed-signaling uses the raw string as key bytes.
blockkey = ${NC_HPB_BLOCK_KEY}

[backend]
# Static list of named backend sections. spreed-signaling 2.x requires this
# even for a single backend — inline `urls`/`secrets` in [backend] is silently
# ignored and yields "No backends configured" at startup.
backends = nextcloud
allowall = false
timeout = 10
connectionsperhost = 8

[nextcloud]
# Comma-separated list of allowed Nextcloud backend base URLs. The Talk client
# tells spreed-signaling which backend it belongs to in the `hello` message
# (Nextcloud computes the URL from `overwrite.cli.url` — i.e. the public URL).
# spreed-signaling rejects the auth if that URL is not in this list, so the
# public hostname MUST be here. The internal docker hostname stays for
# in-cluster diagnostics that bypass Caddy.
urls = http://nextcloud/, https://${NEXTCLOUD_PUBLIC_URL}/
# Must match the secret entered in Nextcloud Talk → High-performance backend settings.
secret = ${NC_HPB_SHARED_SECRET}

[nats]
# nats://loopback starts an embedded NATS server; no sidecar required.
url = nats://loopback

[mcu]
type = janus
# Internal WebSocket URL — signaling and janus share the talk network.
url = ws://janus:8188
