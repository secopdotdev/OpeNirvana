# CRS variable initialization with unique IDs to avoid duplicate conflicts
# with the embedded CRS loaded by load_owasp_crs (which has its own id:900000
# and id:900110 in its embedded crs-setup.conf).
# IDs in the 899xxx range execute in phase:1 before CRS skip rules (941011 etc.).
SecAction "id:899000,phase:1,nolog,pass,t:none,setvar:tx.blocking_paranoia_level=1,setvar:tx.detection_paranoia_level=1"
SecAction "id:899110,phase:1,nolog,pass,t:none,setvar:tx.inbound_anomaly_score_threshold=5,setvar:tx.outbound_anomaly_score_threshold=4"

# Minimal custom detection rules covering the most critical attack categories.
# These use Coraza's confirmed-working native operators (@detectXSS, @detectSQLi,
# @rx). They supplement the embedded CRS, whose detection rules do not accumulate
# anomaly scores in this build of coraza-caddy.
# XSS (libinjection)
SecRule ARGS "@detectXSS" "id:899200,phase:2,pass,nolog,setvar:tx.anomaly_score=+5,msg:XSS_Detected"
SecRule REQUEST_HEADERS "@detectXSS" "id:899201,phase:2,pass,nolog,setvar:tx.anomaly_score=+5,msg:XSS_Header"

# SQLi (libinjection)
SecRule ARGS "@detectSQLi" "id:899210,phase:2,pass,nolog,setvar:tx.anomaly_score=+5,msg:SQLi_Detected"

# Path traversal (RE2-safe regex)
SecRule REQUEST_URI "@rx (?i)(?:\.\.[\/]){2,}" "id:899220,phase:1,pass,nolog,setvar:tx.anomaly_score=+5,msg:PathTraversal"

# Known scanner User-Agents
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(acunetix|nikto|nessus|sqlmap|masscan|nmap|zgrab)" "id:899230,phase:1,pass,nolog,setvar:tx.anomaly_score=+5,msg:Scanner_UA"

# Credential stuffing — high POST rate to auth paths
SecRule REQUEST_URI "@rx (?i)/(auth|login|signin|api/auth)" \
    "id:899300,phase:2,pass,nolog,chain,t:none,setvar:tx.anomaly_score=+3,msg:Credential_Stuffing_Path"
    SecRule REQUEST_METHOD "@streq POST" "t:none"

# Command injection via shell metacharacters in any parameter
SecRule ARGS "@rx (?:[;|`]|\$\(|&&|\|\|)" \
    "id:899310,phase:2,pass,nolog,t:none,setvar:tx.anomaly_score=+5,msg:CmdInjection"

# SSRF — internal IP ranges in request parameters
SecRule ARGS "@rx (?:https?://|//)\s*(?:10\.|172\.(?:1[6-9]|2\d|3[01])\.|192\.168\.|127\.|0\.0\.0\.0|localhost)" \
    "id:899320,phase:2,pass,nolog,t:urlDecodeUni,t:lowercase,setvar:tx.anomaly_score=+5,msg:SSRF_InternalIP"

# Log4Shell / JNDI injection
SecRule REQUEST_URI|ARGS|REQUEST_HEADERS "@rx (?i)\$\{.*j[nm]di.*:/" \
    "id:899330,phase:1,pass,nolog,t:urlDecodeUni,t:htmlEntityDecode,setvar:tx.anomaly_score=+10,msg:Log4Shell_JNDI"

# API endpoints missing Content-Type on mutating methods
SecRule REQUEST_URI "@rx ^/api/" \
    "id:899340,phase:1,pass,nolog,chain,t:none,setvar:tx.anomaly_score=+2,msg:API_Missing_ContentType"
    SecRule REQUEST_METHOD "@rx ^(?:POST|PUT|PATCH)$" "chain"
    SecRule REQUEST_HEADERS:Content-Type "!@rx application/json" "t:none"

# Open redirect via redirect/next/url/goto/return parameter values containing a scheme
SecRule ARGS_NAMES "@rx (?i)^(?:redirect|next|url|goto|return|returnto|dest|destination)$" \
    "id:899350,phase:1,pass,nolog,chain,t:none,setvar:tx.anomaly_score=+3,msg:OpenRedirect"
    SecRule MATCHED_VAR "@rx https?://" "t:none"

# Anomaly score blocking (mirrors CRS rule 949110 — included here because
# the embedded CRS's 949110 does not fire in this build).
SecRule TX:ANOMALY_SCORE "@ge 5" "id:899999,phase:2,deny,status:403,msg:Anomaly_Block"
