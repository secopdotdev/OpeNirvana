# Image digest pins — security/observability core (Rec 6).
#
# Adapted from prod-host infra/registry/images-manifest.yaml. openirvana uses
# TOML, not YAML, because the stdlib-only invariant (ADR-0001) forbids a YAML parser
# in unified-stack/scripts/; tomllib is stdlib and matches the profiles.toml SoT
# (ADR-0003/0004). This manifest is the SOURCE OF TRUTH for the pinned digests of the
# security/observability core — the highest-blast-radius images, which run on :latest
# today (finding V3: 27 unpinned, 0 digest pins).
#
# Each entry freezes the index (multi-arch manifest-list) digest of the listed ref, so
# a mutated upstream tag deploys a DIFFERENT image only with a detectable digest change.
#
# Refresh (when a deliberate update is wanted):
#   docker buildx imagetools inspect <ref> --format '{{.Manifest.Digest}}'
#   then update `digest` below.  (A `make pin-refresh` target is a planned follow-up.)
#
# Verify the deployed containers still match these pins:
#   python3 unified-stack/scripts/check-versions.py --verify-pins
#
# Scope note: this is the CORE-FIRST set (user decision). The remaining ~13 unpinned
# images are a follow-up; pinning the security/observability core first maximises
# reproducibility where a supply-chain swap would do the most damage.

