# coturn — TURN/STUN server for Nextcloud Talk WebRTC
# Plain TURN on 3478; use-auth-secret provides credential security.
# Substitute COTURN_SECRET and PUBLIC_IP before deploying.

listening-port=3478
external-ip=${PUBLIC_IP}
listening-ip=0.0.0.0

# Relay port range — open these on your firewall/security group
min-port=49152
max-port=49200

# Time-limited credentials via shared secret (RFC 5389 compatible)
use-auth-secret
static-auth-secret=${COTURN_SECRET}

realm=${PUBLIC_FQDN}

# Security hardening
fingerprint
no-multicast-peers
no-software-attribute
# Block relay to RFC-1918 ranges (prevent SSRF via TURN relay)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255

log-file=stdout
no-stdout-log=false
