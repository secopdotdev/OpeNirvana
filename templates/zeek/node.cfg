# Cluster topology. ZEEK_WORKER_COUNT in .env controls worker count
# via envsubst during docker-host-config.sh template copy.
# Defaults match the HIGH tier (4 workers).

[logger]
type=logger
host=localhost

[manager]
type=manager
host=localhost

[proxy-1]
type=proxy
host=localhost

[worker-1]
type=worker
host=localhost
interface=af_packet::${ZEEK_INTERFACE}
lb_method=custom
lb_procs=${ZEEK_WORKER_COUNT}
