# Unified foundation stack. See docs/superpowers/specs/ for the full design.
# All resource knobs come from .env; uncomment ONE tier block there.

x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
    - /run
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped
  # Default CPU quota — a STABILITY control, not an efficiency knob: without it an
  # unbounded container (query storm, compromised app, crypto-miner) can starve the
  # scheduler -> healthcheck timeouts -> autoheal restart storm -> cascading failure
  # (perf-resource-workstream.md). Services with their own `cpus:` (caddy, postgres)
  # override via merge; the heavy wazuh indexers use *wazuh-indexer and are unaffected.
  # Generous + env-tunable so it caps runaways without throttling normal workloads.
  cpus: ${DEFAULT_CPU_LIMIT:-2}
  labels:
    - autoheal=true

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Indexer cluster anchor — YAML anchor reused by the three indexer nodes.
# Each node overrides container_name, environment.node.name, volumes, IP.
x-wazuh-indexer: &wazuh-indexer
  image: wazuh/wazuh-indexer:${WAZUH_VERSION}
  depends_on:
    wazuh-init:
      condition: service_completed_successfully
  ulimits:
    memlock:
      soft: -1
      hard: -1
    nofile:
      soft: 65536
      hard: 65536
  mem_limit: ${WAZUH_INDEXER_MEM_LIMIT:-2g}
  healthcheck:
    # Unauthenticated probe — any HTTP response (including 401/503 before the
    # security index is seeded) proves the REST port is up. Auth-based probes
    # would deadlock with wazuh-security-init, which depends on this healthcheck.
    test: ["CMD-SHELL", "curl -sk --max-time 3 -o /dev/null https://localhost:9200/"]
    interval: 20s
    timeout: 10s
    retries: 15
    start_period: 180s
  restart: unless-stopped
  labels:
    - autoheal=true
  logging: *default-logging

networks:
  ingress:
    driver: bridge
    ipam:
      config:
        - subnet: 192.0.2.10/24
          gateway: 192.0.2.10
  auth-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 192.0.2.10/24
          gateway: 192.0.2.10
  data:
    driver: bridge
    ipam:
      config:
        - subnet: 192.0.2.10/24
          gateway: 192.0.2.10
  security:
    driver: bridge
    ipam:
      config:
        - subnet: 192.0.2.10/24
          gateway: 192.0.2.10
  media:
    driver: bridge
    ipam:
      config:
        - subnet: 192.0.2.10/24
          gateway: 192.0.2.10
  apps:
    driver: bridge
    ipam:
      config:
        - subnet: 192.0.2.10/24
          gateway: 192.0.2.10
  cloud:
    driver: bridge
    ipam:
      config:
        - subnet: 192.0.2.10/24
          gateway: 192.0.2.10
  oidc-clients:
    driver: bridge
    ipam:
      config:
        - subnet: 192.0.2.10/24
          gateway: 192.0.2.10
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 192.0.2.10/24
          gateway: 192.0.2.10

services:
  # ==========================================================
  # Tailscale ingress sidecar — caddy shares this netns.
  # ==========================================================
  tailscale-ingress:
    profiles: [core, tailscale-ingress]
    image: tailscale/tailscale:latest
    container_name: tailscale-ingress
    labels:
      - autoheal=true
    mem_limit: ${TAILSCALE_INGRESS_MEM_LIMIT:-256m}
    hostname: ${TAILSCALE_INGRESS_HOSTNAME}
    environment:
      TS_AUTHKEY: ${TAILSCALE_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:41234
      # false: leave Docker's embedded resolver (127.0.0.11) in resolv.conf.
      # If true, Tailscale overwrites resolv.conf with 100.100.100.100 which
      # has no knowledge of Docker container names — caddy (which shares this
      # netns) can't resolve authentik-server, wazuh-dashboard, etc.
      TS_ACCEPT_DNS: "false"
      # Tags (tag:ingress, tag:docker) are applied at authkey-generation time.
      # Run `python3 scripts/set-auth.py tailscale` BEFORE `docker compose up`
      # to provision the Tailscale ACL and create a properly tagged reusable key;
      # the key is written to TAILSCALE_AUTHKEY in .env automatically.
      # Do NOT use --advertise-tags here — that triggers a separate tagOwners ACL
      # ownership check against the key's issuing user (fails for OAuth-issued keys
      # even when the key already carries the tags).
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${DOCK_TAIL}/ingress:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    networks:
      ingress:
        ipv4_address: 192.0.2.10
      data:
        ipv4_address: 192.0.2.10
      security:
        ipv4_address: 192.0.2.10
      media:
        ipv4_address: 192.0.2.10
      apps:
        ipv4_address: 192.0.2.10
      cloud:
        ipv4_address: 192.0.2.10
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  caddy:
    profiles: [core, caddy]
    <<: *hardened
    build:
      context: ./templates/caddy/build
    container_name: caddy
    depends_on:
      tailscale-ingress:
        condition: service_healthy
      crowdsec:
        condition: service_healthy
      authentik-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      PUBLIC_FQDN: ${PUBLIC_FQDN}
      TAILNET_FQDN: ${TAILNET_FQDN}
      EXTRA_ALLOWED_IP: ${EXTRA_ALLOWED_IP}
      CADDY_LOG_LEVEL: ${CADDY_LOG_LEVEL}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CROWDSEC_BOUNCER_API_KEY: ${CROWDSEC_BOUNCER_API_KEY}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB_CADDY_CACHE: ${REDIS_DB_CADDY_CACHE}
      REDIS_DB_CADDY_TLS: ${REDIS_DB_CADDY_TLS}
      CADDY_JWT_SHARED_SECRET: ${CADDY_JWT_SHARED_SECRET}
      # Per-service subdomains — configure in .env.
      # These become {sub}.PUBLIC_FQDN and {sub}.TAILNET_FQDN routes.
      AUTHENTIK_SUBDOMAIN: ${AUTHENTIK_SUBDOMAIN}
      WAZUH_SUBDOMAIN: ${WAZUH_SUBDOMAIN}
      NEXTCLOUD_SUBDOMAIN: ${NEXTCLOUD_SUBDOMAIN}
      # Media stack subdomains — referenced in Caddyfile even when profile is
      # inactive; unresolvable subdomains just never match so no harm done.
      PROWLARR_SUBDOMAIN: ${PROWLARR_SUBDOMAIN:-prowlarr}
      RADARR_SUBDOMAIN: ${RADARR_SUBDOMAIN:-movie}
      SONARR_SUBDOMAIN: ${SONARR_SUBDOMAIN:-tv}
      LIDARR_SUBDOMAIN: ${LIDARR_SUBDOMAIN:-music}
      QBIT_SUBDOMAIN: ${QBIT_SUBDOMAIN:-tor}
      JELLYFIN_SUBDOMAIN: ${JELLYFIN_SUBDOMAIN:-stream}
      JELLYSEERR_SUBDOMAIN: ${JELLYSEERR_SUBDOMAIN:-more}
      # Productivity stack subdomains — inactive when profile not running.
      NTFY_SUBDOMAIN: ${NTFY_SUBDOMAIN:-ntfy}
      TANDOOR_SUBDOMAIN: ${TANDOOR_SUBDOMAIN:-food}
      VIKUNJA_SUBDOMAIN: ${VIKUNJA_SUBDOMAIN:-todo}
      AFFINE_SUBDOMAIN: ${AFFINE_SUBDOMAIN:-note}
      FLARESOLVERR_SUBDOMAIN: ${FLARESOLVERR_SUBDOMAIN:-flare}
      CROWDSEC_SUBDOMAIN: ${CROWDSEC_SUBDOMAIN:-crowd}
      DOCKHAND_SUBDOMAIN: ${DOCKHAND_SUBDOMAIN:-dock}
      IMMICH_SUBDOMAIN: ${IMMICH_SUBDOMAIN:-pic}
      FALCO_SUBDOMAIN: ${FALCO_SUBDOMAIN:-sec}
      ZEEK_SUBDOMAIN: ${ZEEK_SUBDOMAIN:-net}
      N8N_SUBDOMAIN: ${N8N_SUBDOMAIN:-soar}
      TALK_SUBDOMAIN: ${TALK_SUBDOMAIN:-talk}
      JANUS_SUBDOMAIN: ${JANUS_SUBDOMAIN:-gate}
      KAFKA_SUBDOMAIN: ${KAFKA_SUBDOMAIN:-kafka}
      GRAFANA_SUBDOMAIN: ${GRAFANA_SUBDOMAIN:-dash}
    volumes:
      - ${DOCK_CONF}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DOCK_CONF}/caddy/snippets:/etc/caddy/snippets:ro
      - ${DOCK_CONF}/caddy/coraza:/etc/caddy/coraza:ro
      - ${DOCK_CONF}/caddy/data:/data
      - ${DOCK_CONF}/caddy/logs:/var/log/caddy
      - ${DOCK_CONF}/caddy/souin:/var/cache/souin
    # Caddy runs inside tailscale-ingress's network namespace (so it serves on
    # the tailnet + the published 80/443). COUPLING: recreating tailscale-ingress
    # gives it a new netns and orphans Caddy on the old one (ingress → HTTP 521).
    # ALWAYS recreate caddy together with it:
    #   docker compose up -d tailscale-ingress caddy
    # A full `docker compose up -d` handles this automatically.
    network_mode: "service:tailscale-ingress"
    mem_limit: ${CADDY_MEM_LIMIT:-2g}
    cpus: ${CADDY_CPUS:-2}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    read_only: false  # Caddy's /data needs write access — socketed volume not enough
    user: "1010:1010"  # match svc-user:media on host — cap_drop:ALL strips
                       # DAC_OVERRIDE, so root-in-container can't read 640
                       # config files owned by svc-user:media.
    cap_add:
      # The caddy binary has file cap cap_net_bind_service=ep so it can bind
      # :80/:443 without root. no-new-privileges + cap_drop:ALL strips that at
      # exec ("operation not permitted"), so we re-add it explicitly.
      - NET_BIND_SERVICE

  crowdsec:
    profiles: [core, crowdsec]
    <<: *hardened
    image: crowdsecurity/crowdsec:${CROWDSEC_VERSION:-latest}
    container_name: crowdsec
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
    environment:
      GID: "1010"
      DISABLE_ONLINE_API: "true"
      COLLECTIONS: "crowdsecurity/caddy crowdsecurity/linux crowdsecurity/iptables crowdsecurity/whitelist-good-actors"
      PARSERS: "crowdsecurity/caddy-logs crowdsecurity/whitelists"
    volumes:
      # Bind whole /etc/crowdsec so image-seeded dirs (patterns, parsers,
      # scenarios, collections, contexts, postoverflows) survive alongside
      # our templated config files. Seeded from /staging on bootstrap.
      - ${DOCK_CONF}/crowdsec:/etc/crowdsec
      - ${DOCK_CONF}/crowdsec/db:/var/lib/crowdsec/data
      - ${DOCK_CONF}/caddy/logs:/var/log/caddy:ro
    networks:
      security:
        ipv4_address: 192.0.2.10
      ingress:
        ipv4_address: 192.0.2.10
    mem_limit: ${CROWDSEC_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: false
    logging: *default-logging

  torproxy:
    profiles: [core, netsec]
    image: dperson/torproxy:latest
    container_name: torproxy
    restart: unless-stopped
    networks:
      security:
        ipv4_address: 192.0.2.10
    mem_limit: ${TORPROXY_MEM_LIMIT:-256m}
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --socks5-hostname 127.0.0.1:9050 https://check.torproject.org/api/ip | grep -q '\"IsTor\":true'"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 90s
    logging: *default-logging

  socket-proxy-ro:
    profiles: [core, socket-proxy-ro]
    <<: *hardened
    image: tecnativa/docker-socket-proxy:${SOCKET_PROXY_VERSION:-v0.4.2}
    container_name: socket-proxy-ro
    mem_limit: 64m
    environment:
      CONTAINERS: "1"
      SERVICES: "1"
      TASKS: "1"
      NETWORKS: "1"
      IMAGES: "1"
      INFO: "1"
      EVENTS: "1"
      VERSION: "1"
      POST: "0"
      ALLOW_START: "0"
      ALLOW_STOP: "0"
      ALLOW_RESTARTS: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      security:
        ipv4_address: 192.0.2.10
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2375/_ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    read_only: false
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    logging: *default-logging

  # RW Docker-API proxy for the management plane (Dockhand) + autoheal.
  # Scoped to single-host container management: view + lifecycle (start/stop/
  # restart/delete), console (EXEC), volumes, images (pull via AUTH +
  # DISTRIBUTION), and SYSTEM (df/prune). Swarm endpoints (NODES/SECRETS/
  # CONFIGS) stay off — not a swarm. This grants Dockhand effectively full
  # Docker control, which a management UI requires; the boundary is that
  # Dockhand is Authentik-gated and this proxy is reachable only on the
  # internal `security` network.
  socket-proxy-rw:
    profiles: [core, socket-proxy-rw]
    <<: *hardened
    image: tecnativa/docker-socket-proxy:${SOCKET_PROXY_VERSION:-v0.4.2}
    container_name: socket-proxy-rw
    mem_limit: 64m
    environment:
      CONTAINERS: "1"
      SERVICES: "1"
      TASKS: "1"
      NETWORKS: "1"
      IMAGES: "1"
      VOLUMES: "1"
      INFO: "1"
      EVENTS: "1"
      VERSION: "1"
      EXEC: "1"
      SYSTEM: "1"
      AUTH: "1"
      DISTRIBUTION: "1"
      POST: "1"
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      ALLOW_RESTARTS: "1"
      ALLOW_DELETE: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      security:
        ipv4_address: 192.0.2.10
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2375/_ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    read_only: false
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    logging: *default-logging

  autoheal:
    profiles: [core, autoheal]
    <<: *hardened
    image: willfarrell/autoheal:latest
    container_name: autoheal
    depends_on:
      socket-proxy-rw:
        condition: service_healthy
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"
      DOCKER_SOCK: "tcp://socket-proxy-rw:2375"
      CURL_TIMEOUT: "30"
    networks:
      - security
    mem_limit: 256m
    read_only: false  # container writes internal state
    logging: *default-logging

  postgres:
    profiles: [core, postgres]
    image: pgvector/pgvector:pg16
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS}
      # Per-app triples consumed by 00-create-app-dbs.sh
      AUTHENTIK_DB_NAME: ${AUTHENTIK_DB_NAME}
      AUTHENTIK_DB_USER: ${AUTHENTIK_DB_USER}
      AUTHENTIK_DB_PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      NEXTCLOUD_DB_NAME: ${NEXTCLOUD_DB_NAME}
      NEXTCLOUD_DB_USER: ${NEXTCLOUD_DB_USER}
      NEXTCLOUD_DB_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      TANDOOR_DB_NAME: ${TANDOOR_DB_NAME}
      TANDOOR_DB_USER: ${TANDOOR_DB_USER}
      TANDOOR_DB_PASSWORD: ${TANDOOR_DB_PASSWORD}
      VIKUNJA_DB_NAME: ${VIKUNJA_DB_NAME}
      VIKUNJA_DB_USER: ${VIKUNJA_DB_USER}
      VIKUNJA_DB_PASSWORD: ${VIKUNJA_DB_PASSWORD}
      AFFINE_DB_NAME: ${AFFINE_DB_NAME}
      AFFINE_DB_USER: ${AFFINE_DB_USER}
      AFFINE_DB_PASSWORD: ${AFFINE_DB_PASSWORD}
      IMMICH_DB_NAME: ${IMMICH_DB_NAME}
      IMMICH_DB_USER: ${IMMICH_DB_USER}
      IMMICH_DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      N8N_DB_NAME: ${N8N_DB_NAME}
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - ${DOCK_DB}/postgres/data:/var/lib/postgresql/data
      - ${DOCK_DB}/postgres/init.d:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-16MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
    networks:
      data:
        ipv4_address: 192.0.2.10
    mem_limit: ${POSTGRES_MEM_LIMIT:-4g}
    cpus: ${POSTGRES_CPUS:-2}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    labels:
      - autoheal=true
    user: "1010:1010"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  redis:
    profiles: [core, redis]
    <<: *hardened
    image: redis:7-alpine
    container_name: redis
    user: "1010:1010"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - ${REDIS_APPENDONLY}
      - --maxmemory
      - ${REDIS_MAXMEMORY}
      - --maxmemory-policy
      - allkeys-lru
      - --io-threads
      - ${REDIS_IO_THREADS}
      - --io-threads-do-reads
      - "yes"
      - --protected-mode
      - "yes"
    volumes:
      - ${DOCK_DB}/redis:/data
    networks:
      data:
        ipv4_address: 192.0.2.10
    mem_limit: ${REDIS_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: false
    logging: *default-logging

  wazuh-init:
    profiles: [siem, wazuh-init]
    # One-shot: generates internal TLS certs the first time the stack comes up.
    # Subsequent runs detect admin.pem and exit 0. Generates each cert with both
    # IP and DNS SANs so clients connecting via docker-compose service names
    # (e.g. filebeat -> wazuh-indexer) pass hostname verification.
    # DNs (C=US, L=California, O=Wazuh, OU=Wazuh, CN=<name>) match the admin_dn
    # and nodes_dn entries in opensearch.yml.
    image: alpine:3
    container_name: wazuh-init
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -f /certs/admin.pem ]; then
          echo "wazuh certs already present; skipping generation."
          exit 0
        fi
        apk add --no-cache openssl
        cd /tmp

        SUBJ_BASE="/C=US/L=California/O=Wazuh/OU=Wazuh"

        openssl genrsa -out root-ca.key 4096
        openssl req -x509 -new -nodes -key root-ca.key -sha256 -days 3650 \
          -out root-ca.pem -subj "$${SUBJ_BASE}/CN=root-ca"

        gen_server_cert() {
          n=$$1; dns=$$2; ip=$$3
          openssl genrsa -out "$${n}-key.pem" 2048
          cat > "$${n}.cnf" <<EOF
        [req]
        distinguished_name=dn
        prompt=no
        [dn]
        C=US
        L=California
        O=Wazuh
        OU=Wazuh
        CN=$${n}
        [v3]
        basicConstraints=CA:FALSE
        keyUsage=digitalSignature,keyEncipherment
        extendedKeyUsage=serverAuth,clientAuth
        subjectAltName=@san
        [san]
        DNS.1=$${dns}
        IP.1=$${ip}
        EOF
          openssl req -new -key "$${n}-key.pem" -out "$${n}.csr" -config "$${n}.cnf"
          openssl x509 -req -in "$${n}.csr" -CA root-ca.pem -CAkey root-ca.key \
            -CAcreateserial -out "$${n}.pem" -days 3650 -sha256 \
            -extfile "$${n}.cnf" -extensions v3
        }

        # Admin client cert (clientAuth only). CN=admin matches opensearch.yml admin_dn.
        openssl genrsa -out admin-key-rsa.pem 2048
        openssl req -new -key admin-key-rsa.pem -out admin.csr \
          -subj "$${SUBJ_BASE}/CN=admin"
        cat > admin-ext.cnf <<EOF
        basicConstraints=CA:FALSE
        keyUsage=digitalSignature,keyEncipherment
        extendedKeyUsage=clientAuth
        EOF
        openssl x509 -req -in admin.csr -CA root-ca.pem -CAkey root-ca.key \
          -CAcreateserial -out admin.pem -days 3650 -sha256 -extfile admin-ext.cnf
        # OpenSearch security plugin expects admin key in PKCS#8.
        openssl pkcs8 -topk8 -inform PEM -outform PEM -nocrypt \
          -in admin-key-rsa.pem -out admin-key.pem

        # Indexer cert is shared across all three nodes — one CN, three SANs.
        openssl genrsa -out wazuh-indexer-key.pem 2048
        cat > wazuh-indexer.cnf <<EOF
        [req]
        distinguished_name=dn
        prompt=no
        [dn]
        C=US
        L=California
        O=Wazuh
        OU=Wazuh
        CN=wazuh-indexer
        [v3]
        basicConstraints=CA:FALSE
        keyUsage=digitalSignature,keyEncipherment
        extendedKeyUsage=serverAuth,clientAuth
        subjectAltName=@san
        [san]
        DNS.1=wazuh-indexer-1
        DNS.2=wazuh-indexer-2
        DNS.3=wazuh-indexer-3
        IP.1=192.0.2.10
        IP.2=192.0.2.10
        IP.3=192.0.2.10
        EOF
        openssl req -new -key wazuh-indexer-key.pem -out wazuh-indexer.csr -config wazuh-indexer.cnf
        openssl x509 -req -in wazuh-indexer.csr -CA root-ca.pem -CAkey root-ca.key \
          -CAcreateserial -out wazuh-indexer.pem -days 3650 -sha256 \
          -extfile wazuh-indexer.cnf -extensions v3

        gen_server_cert wazuh-manager   wazuh-manager   192.0.2.10
        gen_server_cert wazuh-dashboard wazuh-dashboard 192.0.2.10

        install -o 1000 -g 1000 -m 640 root-ca.pem        /certs/
        install -o 1000 -g 1000 -m 640 admin.pem          /certs/
        install -o 1000 -g 1000 -m 640 admin-key.pem      /certs/
        install -o 1000 -g 1000 -m 640 wazuh-indexer.pem      /certs/indexer.pem
        install -o 1000 -g 1000 -m 640 wazuh-indexer-key.pem  /certs/indexer-key.pem
        install -o 1000 -g 1000 -m 640 wazuh-manager.pem      /certs/manager.pem
        install -o 1000 -g 1000 -m 640 wazuh-manager-key.pem  /certs/manager-key.pem
        install -o 1000 -g 1000 -m 640 wazuh-dashboard.pem    /certs/dashboard.pem
        install -o 1000 -g 1000 -m 640 wazuh-dashboard-key.pem /certs/dashboard-key.pem
        echo "wazuh certs generated."
    volumes:
      - ${DOCK_CONF}/wazuh/certs:/certs
    networks:
      security:
        ipv4_address: 192.0.2.10
    restart: "no"
    logging: *default-logging

  wazuh-indexer-1:
    profiles: [siem, wazuh-indexer-1]
    <<: *wazuh-indexer
    container_name: wazuh-indexer-1
    environment:
      - NODE_NAME=wazuh-indexer-1
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms${WAZUH_INDEXER_JVM_HEAP:-1g} -Xmx${WAZUH_INDEXER_JVM_HEAP:-1g}
      - INDEXER_PASSWORD=${WAZUH_INDEXER_ADMIN_PASSWORD}
    volumes:
      - ${DOCK_DATA}/wazuh/indexer-1:/var/lib/wazuh-indexer
      - ${DOCK_CONF}/wazuh/indexer/opensearch.yml:/usr/share/wazuh-indexer/opensearch.yml:ro
      - ${DOCK_CONF}/wazuh/certs:/usr/share/wazuh-indexer/certs:ro
    networks:
      security:
        ipv4_address: 192.0.2.10

  wazuh-indexer-2:
    profiles: [siem, wazuh-indexer-2]
    <<: *wazuh-indexer
    container_name: wazuh-indexer-2
    environment:
      - NODE_NAME=wazuh-indexer-2
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms${WAZUH_INDEXER_JVM_HEAP:-1g} -Xmx${WAZUH_INDEXER_JVM_HEAP:-1g}
      - INDEXER_PASSWORD=${WAZUH_INDEXER_ADMIN_PASSWORD}
    volumes:
      - ${DOCK_DATA}/wazuh/indexer-2:/var/lib/wazuh-indexer
      - ${DOCK_CONF}/wazuh/indexer/opensearch.yml:/usr/share/wazuh-indexer/opensearch.yml:ro
      - ${DOCK_CONF}/wazuh/certs:/usr/share/wazuh-indexer/certs:ro
    networks:
      security:
        ipv4_address: 192.0.2.10

  wazuh-indexer-3:
    profiles: [siem, wazuh-indexer-3]
    <<: *wazuh-indexer
    container_name: wazuh-indexer-3
    environment:
      - NODE_NAME=wazuh-indexer-3
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms${WAZUH_INDEXER_JVM_HEAP:-1g} -Xmx${WAZUH_INDEXER_JVM_HEAP:-1g}
      - INDEXER_PASSWORD=${WAZUH_INDEXER_ADMIN_PASSWORD}
    volumes:
      - ${DOCK_DATA}/wazuh/indexer-3:/var/lib/wazuh-indexer
      - ${DOCK_CONF}/wazuh/indexer/opensearch.yml:/usr/share/wazuh-indexer/opensearch.yml:ro
      - ${DOCK_CONF}/wazuh/certs:/usr/share/wazuh-indexer/certs:ro
    networks:
      security:
        ipv4_address: 192.0.2.10

  wazuh-security-init:
    profiles: [siem, wazuh-security-init]
    # One-shot: seeds the OpenSearch security index with bcrypt hashes of the
    # admin and kibanaserver passwords from the environment. Idempotent — a
    # flag file on the shared certs volume records success.
    image: wazuh/wazuh-indexer:${WAZUH_VERSION}
    container_name: wazuh-security-init
    depends_on:
      wazuh-indexer-1:
        condition: service_healthy
      wazuh-indexer-2:
        condition: service_healthy
      wazuh-indexer-3:
        condition: service_healthy
    environment:
      ADMIN_PASSWORD: ${WAZUH_INDEXER_ADMIN_PASSWORD}
      KIBANASERVER_PASSWORD: ${WAZUH_INDEXER_KIBANASERVER_PASSWORD}
      OPENSEARCH_JAVA_HOME: /usr/share/wazuh-indexer/jdk
    user: "1000:1000"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eu
        FLAG=/certs/.security-initialized
        if [ -f "$${FLAG}" ]; then
          echo "security already initialized; skipping."
          exit 0
        fi
        HASH_TOOL=/usr/share/wazuh-indexer/plugins/opensearch-security/tools/hash.sh
        SEC_TOOL=/usr/share/wazuh-indexer/plugins/opensearch-security/tools/securityadmin.sh
        # Wait until the cluster has formed and the default .opendistro_security
        # index is writable (securityadmin will otherwise 503 on first try).
        until curl -sk --max-time 3 https://wazuh-indexer-1:9200/_cluster/health \
            --cacert /certs/root-ca.pem \
            --cert /certs/admin.pem --key /certs/admin-key.pem \
            2>&1 | grep -qE 'green|yellow|Security not initialized'; do
          echo "waiting for indexer cluster..."
          sleep 5
        done
        ADMIN_HASH=$$(bash "$${HASH_TOOL}" -p "$${ADMIN_PASSWORD}" | tail -1)
        KIB_HASH=$$(bash "$${HASH_TOOL}" -p "$${KIBANASERVER_PASSWORD}" | tail -1)
        WORK=$$(mktemp -d)
        cp /usr/share/wazuh-indexer/opensearch-security/*.yml "$${WORK}/"
        sed -i "/^admin:/,/^[a-z]/ { s|hash: .*|hash: \"$${ADMIN_HASH}\"| }" "$${WORK}/internal_users.yml"
        sed -i "/^kibanaserver:/,/^[a-z]/ { s|hash: .*|hash: \"$${KIB_HASH}\"| }" "$${WORK}/internal_users.yml"
        bash "$${SEC_TOOL}" -cd "$${WORK}" -nhnv \
          -cacert /certs/root-ca.pem \
          -cert /certs/admin.pem \
          -key /certs/admin-key.pem \
          -p 9200 -icl -h wazuh-indexer-1
        touch "$${FLAG}"
        echo "wazuh security initialized."
    volumes:
      - ${DOCK_CONF}/wazuh/certs:/certs
    networks:
      security:
        ipv4_address: 192.0.2.10
    restart: "no"
    logging: *default-logging

  wazuh-manager:
    profiles: [siem, wazuh-manager]
    image: wazuh/wazuh-manager:${WAZUH_VERSION}
    container_name: wazuh-manager
    depends_on:
      wazuh-security-init:
        condition: service_completed_successfully
      wazuh-indexer-1:
        condition: service_healthy
      wazuh-indexer-2:
        condition: service_healthy
      wazuh-indexer-3:
        condition: service_healthy
    environment:
      # The filebeat cont-init uses the raw INDEXER_URL value as a single string
      # inside a YAML flow list: hosts: ['$INDEXER_URL']. Embedding the closing
      # quote + comma + next entry extends it into a valid three-host array.
      INDEXER_URL: https://wazuh-indexer-1:9200','https://wazuh-indexer-2:9200','https://wazuh-indexer-3:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_ADMIN_PASSWORD}
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD}
      # Filebeat trusts the internal root CA generated by wazuh-init.
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/wazuh/root-ca.pem
      FILEBEAT_SSL_VERIFICATION_MODE: full
    volumes:
      - ${DOCK_DATA}/wazuh/manager:/var/ossec/data
      - ${DOCK_CONF}/wazuh/certs:/etc/ssl/wazuh:ro
      # Log sources tailed by the localfile block added by maintain.py wazuh.
      # Bind-mounted at the same host path so ossec.conf paths match exactly.
      - ${DOCK_CONF}/caddy/logs:${DOCK_CONF}/caddy/logs:ro
      - ${DOCK_CONF}/crowdsec/notifications:${DOCK_CONF}/crowdsec/notifications:ro
      - ${DOCK_CONF}/falco:${DOCK_CONF}/falco:ro
      # Zeek live logs: shared spool/logger dir exposed at the path agent-host.conf
      # references as /dock/conf/zeek/logs/current/ (bypasses dangling symlink on host).
      - ${DOCK_DATA}/zeek/spool/logger:${DOCK_CONF}/zeek/logs/current:ro
      # Cloudflare security event log tailed by Wazuh.
      - ${DOCK_CONF}/cloudflare:${DOCK_CONF}/cloudflare:ro
    networks:
      security:
        ipv4_address: 192.0.2.10
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: ${WAZUH_MANAGER_MEM_LIMIT:-2g}
    cap_add:
      - SYS_RESOURCE
      - SYS_PTRACE
    healthcheck:
      # wazuh-control status exits non-zero when *any* optional daemon isn't
      # running, so gate on the essential ones individually.
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status | grep -E 'wazuh-(analysisd|remoted|modulesd|apid) is running' | wc -l | grep -q '^4$'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  wazuh-dashboard:
    profiles: [siem, wazuh-dashboard]
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION}
    container_name: wazuh-dashboard
    depends_on:
      wazuh-security-init:
        condition: service_completed_successfully
      wazuh-indexer-1:
        condition: service_healthy
      wazuh-indexer-2:
        condition: service_healthy
      wazuh-indexer-3:
        condition: service_healthy
      wazuh-manager:
        condition: service_healthy
    environment:
      INDEXER_URL: https://wazuh-indexer-1:9200
      INDEXER_USERNAME: kibanaserver
      INDEXER_PASSWORD: ${WAZUH_INDEXER_KIBANASERVER_PASSWORD}
      WAZUH_API_URL: https://wazuh-manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: ${WAZUH_INDEXER_KIBANASERVER_PASSWORD}
    volumes:
      # Mount only the single file — the image's /config dir also holds
      # node.options + keystore; shadowing the whole dir breaks the keystore
      # keystore init done by the entrypoint.
      - ${DOCK_CONF}/wazuh/dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      # wazuh.yml holds the Wazuh API connection (host, port, username, password).
      # Persisted here so container recreation doesn't revert to default credentials.
      - ${DOCK_CONF}/wazuh/dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - ${DOCK_CONF}/wazuh/certs:/usr/share/wazuh-dashboard/certs:ro
    networks:
      security:
        ipv4_address: 192.0.2.10
    mem_limit: ${WAZUH_DASHBOARD_MEM_LIMIT:-1g}
    healthcheck:
      # 401 from /status means the server is up — Wazuh requires auth to read it.
      test: ["CMD-SHELL", "curl -kso /dev/null -w '%{http_code}' https://localhost:5601/status | grep -qE '^(200|302|401)$'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  falco:
    profiles: [runtime-sec, falco]
    image: falcosecurity/falco:${FALCO_VERSION:-latest}
    container_name: falco
    privileged: true
    pid: host
    environment:
      FALCO_BPF_PROBE: ""
      FALCO_HOSTNAME: ${FALCO_HOSTNAME:-falco}
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock:ro
      - /dev:/host/dev:ro
      - /proc:/host/proc:ro
      - /boot:/host/boot:ro
      - /lib/modules:/host/lib/modules:ro
      - /usr:/host/usr:ro
      - /etc:/host/etc:ro
      - ${DOCK_CONF}/falco/falco.yaml:/etc/falco/falco.yaml:ro
      - ${DOCK_CONF}/falco/falco_rules.local.yaml:/etc/falco/falco_rules.local.yaml:ro
      - ${DOCK_CONF}/falco/rules.d:/etc/falco/rules.d:ro
      - ${DOCK_CONF}/falco:/var/log/falco
    networks:
      security:
        ipv4_address: 192.0.2.10
    mem_limit: ${FALCO_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "pidof falco >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  zeek:
    profiles: [netmon, zeek]
    image: zeek/zeek:${ZEEK_VERSION:-8.1.1}
    container_name: zeek
    network_mode: host
    environment:
      ZEEK_WORKER_COUNT: ${ZEEK_WORKER_COUNT:-2}
    volumes:
      - ${DOCK_CONF}/zeek/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek:ro
      - ${DOCK_CONF}/zeek/node.cfg:/usr/local/zeek/etc/node.cfg:ro
      - ${DOCK_CONF}/zeek/networks.cfg:/usr/local/zeek/etc/networks.cfg:ro
      - ${DOCK_CONF}/zeek/intel:/usr/local/zeek/intel:ro
      - ${DOCK_CONF}/zeek/logs:/usr/local/zeek/logs
      - ${DOCK_DATA}/zeek/spool:/usr/local/zeek/spool
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
      - DAC_OVERRIDE
    command:
      - /bin/sh
      - -c
      - "zeekctl deploy && tail -f /usr/local/zeek/logs/current/stderr.log"
    mem_limit: ${ZEEK_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD-SHELL", "zeekctl status 2>/dev/null | grep -q running"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  authentik-migration:
    profiles: [core, authentik-migration]
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION}
    container_name: authentik-migration
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: migrate
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_REDIS__PASSWORD: ${REDIS_PASSWORD}
      AUTHENTIK_REDIS__DB: ${REDIS_DB_AUTHENTIK}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    networks:
      - data
    restart: "no"
    logging: *default-logging

  authentik-server:
    profiles: [core, authentik-server]
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION}
    container_name: authentik-server
    depends_on:
      authentik-migration:
        condition: service_completed_successfully
    command: server
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_REDIS__PASSWORD: ${REDIS_PASSWORD}
      AUTHENTIK_REDIS__DB: ${REDIS_DB_AUTHENTIK}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${ADMIN_EMAIL}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - ${DOCK_CONF}/authentik/media:/media
      - ${DOCK_CONF}/authentik/custom-templates:/templates:ro
    networks:
      auth-internal:
        ipv4_address: 192.0.2.10
      ingress:
        ipv4_address: 192.0.2.10
      data:
      oidc-clients:
        ipv4_address: 192.0.2.10
    mem_limit: ${AUTHENTIK_SERVER_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  authentik-worker:
    profiles: [core, authentik-worker]
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION}
    container_name: authentik-worker
    depends_on:
      authentik-server:
        condition: service_healthy
    command: worker
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_REDIS__PASSWORD: ${REDIS_PASSWORD}
      AUTHENTIK_REDIS__DB: ${REDIS_DB_AUTHENTIK}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    volumes:
      - ${DOCK_CONF}/authentik/media:/media
      - ${DOCK_CONF}/authentik/custom-templates:/templates:ro
    networks:
      auth-internal:
        ipv4_address: 192.0.2.10
      data:
    mem_limit: ${AUTHENTIK_WORKER_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  # ==========================================================
  # Authentik Proxy Outpost — serves /outpost.goauthentik.io/
  # forward-auth requests that Caddy delegates via forward_auth.
  # The embedded outpost does NOT handle forward-auth from
  # external proxies; a dedicated container is required.
  # ==========================================================
  authentik-proxy:
    profiles: [core, authentik-proxy]
    image: ghcr.io/goauthentik/proxy:${AUTHENTIK_VERSION}
    container_name: authentik-proxy
    depends_on:
      authentik-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AUTHENTIK_HOST: https://${AUTHENTIK_SUBDOMAIN}.${PUBLIC_FQDN}
      AUTHENTIK_INSECURE: "true"
      AUTHENTIK_TOKEN: ${AUTHENTIK_OUTPOST_TOKEN}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_REDIS__PASSWORD: ${REDIS_PASSWORD}
      AUTHENTIK_REDIS__DB: ${REDIS_DB_AUTHENTIK}
    extra_hosts:
      # Route example.com to Caddy on the ingress network (avoids Cloudflare
      # round-trip) so OIDC discovery returns public URLs, not internal hostnames.
      - "${AUTHENTIK_SUBDOMAIN}.${PUBLIC_FQDN}:192.0.2.10"
    networks:
      ingress:
        ipv4_address: 192.0.2.10
      data:
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9300/metrics | grep -q authentik_outpost_info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  # ==========================================================
  # OpenBao — secrets backend of record (ADR 0001).
  # File storage on security net; TLS terminated upstream by
  # Caddy (public) and Tailscale (tailnet). IPC_LOCK granted
  # so mlock keeps unseal keys out of swap.
  # UI: bao.PUBLIC_FQDN (Caddy+Authentik) / bao.TAILNET_FQDN
  # Bootstrap: scripts/bao-bootstrap.py (idempotent, run before compose up)
  # Digest: record after first pull with:
  #   docker buildx imagetools inspect openbao/openbao:2.4.1
  # ==========================================================
  openbao:
    profiles: [core, openbao]
    # digest pinned (verified on first pull): openbao/openbao:2.4.1
    image: openbao/openbao:2.4.1@sha256:597f62847dd382382056a1d6704d50465908c2040038c4611832a23269a67112
    container_name: openbao
    command: ["server", "-config=/openbao/config/openbao.hcl"]
    # NOTE: no IPC_LOCK cap — OpenBao 2.x removed mlock. Protect keys via host swap
    # hardening instead (see docs/openbao-runbook.md).
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      BAO_AKV_TENANT_ID: ${BAO_AKV_TENANT_ID:-}
      BAO_AKV_CLIENT_ID: ${BAO_AKV_CLIENT_ID:-}
      BAO_AKV_CLIENT_SECRET: ${BAO_AKV_CLIENT_SECRET:-}
      BAO_AKV_VAULT_NAME: ${BAO_AKV_VAULT_NAME:-}
      BAO_AKV_KEY_NAME: ${BAO_AKV_KEY_NAME:-}
    volumes:
      - ${DOCK_CONF}/openbao/config:/openbao/config:ro
      - ${DOCK_DATA}/openbao/data:/openbao/data
      - ${DOCK_DATA}/openbao/audit:/openbao/audit
    networks:
      security:
        ipv4_address: 192.0.2.10
    healthcheck:
      # /v1/sys/health: 200 = unsealed+active, 503 = sealed, 501 = uninit. Accept 200/429/472/473/501/503
      # as "process up" so a sealed-but-running vault is not flapped as unhealthy.
      test: ["CMD-SHELL", "bao status -address=http://127.0.0.1:8200 >/dev/null 2>&1; rc=$$?; [ $$rc -eq 0 ] || [ $$rc -eq 2 ]"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  # ==========================================================
  # Nextcloud — file sync + collaboration. Phase 3 app.
  # Auth: Nextcloud-native OIDC via Authentik (user_oidc app).
  # Caddy does NOT apply forward-auth to cloud.*; Nextcloud owns
  # its own login page and OIDC callback. Shares Postgres + Redis.
  # Runs as www-data (uid 33); /dock/data/nextcloud must be
  # chown 33:33 on the host (docker-host-config.sh handles this).
  # read_only omitted — Nextcloud writes PHP sessions + config
  # into /var/www/html at runtime.
  # ==========================================================
  nextcloud:
    profiles: [files, nextcloud]
    image: nextcloud:${NEXTCLOUD_VERSION:-33}
    container_name: nextcloud
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NEXTCLOUD_TRUSTED_DOMAINS: >-
        ${NEXTCLOUD_SUBDOMAIN}.${PUBLIC_FQDN}
        ${NEXTCLOUD_SUBDOMAIN}.${TAILNET_FQDN}
        nextcloud
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST_PORT: 6379
      REDIS_HOST_DB: ${REDIS_DB_NEXTCLOUD}
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://${NEXTCLOUD_SUBDOMAIN}.${PUBLIC_FQDN}
      # Space-separated trusted reverse proxies (the NC image splits this into
      # the trusted_proxies array). Caddy connects from 192.0.2.10 (shares the
      # tailscale-ingress netns) on the cloud network. notify-push (192.0.2.10)
      # also forwards client IPs to NC during its self-test/push validation, so
      # it must be trusted too — otherwise notify_push:setup fails its
      # "trusted proxy" check. Without these, mod_remoteip won't honor
      # X-Forwarded-For and NC sees the proxy IP as the client.
      TRUSTED_PROXIES: "192.0.2.10 192.0.2.10"
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_LIMIT: 10G
      # OIDC — read by the occ user_oidc:provider command (see .env.example).
      # These are not consumed by the Nextcloud image directly; they are available
      # in the container environment so the occ command can reference them via $VAR.
      NEXTCLOUD_OIDC_PROVIDER_NAME: ${NEXTCLOUD_OIDC_PROVIDER_NAME:-Authentik}
      NEXTCLOUD_OIDC_CLIENT_ID: ${NEXTCLOUD_OIDC_CLIENT_ID:-}
      NEXTCLOUD_OIDC_CLIENT_SECRET: ${NEXTCLOUD_OIDC_CLIENT_SECRET:-}
      NEXTCLOUD_OIDC_DISCOVERY_URL: ${NEXTCLOUD_OIDC_DISCOVERY_URL:-}
    volumes:
      - ${DOCK_DATA}/nextcloud:/var/www/html
      - ${DOCK_CONF}/nextcloud/servername.conf:/etc/apache2/conf-enabled/servername.conf:ro
    networks:
      apps:
        ipv4_address: 192.0.2.10
      cloud:
        ipv4_address: 192.0.2.10
      data:
      oidc-clients:
        ipv4_address: 192.0.2.10
    mem_limit: ${NEXTCLOUD_MEM_LIMIT:-2g}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "php", "/var/www/html/occ", "status", "--no-warnings"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  # ==========================================================
  # notify-push — Nextcloud Client Push (High-Performance
  # Backend for Files). Runs the Rust daemon bundled inside the
  # notify_push app. The binary only exists AFTER
  # `occ app:install notify_push` runs in the nextcloud container
  # (maintain.py nextcloud), so the command polls for it before
  # exec — this resolves the first-deploy chicken-and-egg without
  # a separate orchestration step. Reads DB + Redis creds from
  # the shared read-only config.php. Serves WS on :7867; Caddy
  # proxies it at <cloud-fqdn>/push (occ notify_push:setup).
  # entrypoint:[] bypasses the NC image entrypoint so it never
  # tries to (re)install Nextcloud against the shared volume.
  # ==========================================================
  notify-push:
    profiles: [files, notify-push]
    <<: *hardened
    image: nextcloud:${NEXTCLOUD_VERSION:-33}
    container_name: notify-push
    depends_on:
      nextcloud:
        condition: service_healthy
      redis:
        condition: service_healthy
    user: "33:33"
    entrypoint: []
    command:
      - /bin/sh
      - -c
      - |
        BIN=/var/www/html/custom_apps/notify_push/bin/x86_64/notify_push
        echo "notify-push: waiting for binary (installed via 'occ app:install notify_push')..."
        until [ -x "$$BIN" ]; do sleep 10; done
        echo "notify-push: starting daemon on :7867"
        exec "$$BIN" --port 7867 /var/www/html/config/config.php
    environment:
      NEXTCLOUD_URL: http://nextcloud
      PORT: "7867"
    volumes:
      - ${DOCK_DATA}/nextcloud:/var/www/html:ro
    networks:
      cloud:
        ipv4_address: 192.0.2.10
      data:
    mem_limit: ${NOTIFY_PUSH_MEM_LIMIT:-128m}
    healthcheck:
      # Liveness only: /test/cookie returns 400 ("Missing token") without auth,
      # so DON'T use curl -f (that treats 4xx as failure). A plain request that
      # gets *any* HTTP response proves the daemon is listening; connection
      # refused (daemon down / still waiting for the binary) exits non-zero.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:7867/test/cookie || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging

  # ==========================================================
  # coturn — TURN/STUN server for Nextcloud Talk WebRTC.
  # Binds directly to host ports 3478 and 49152-49200 (UDP/TCP)
  # — these bypass Cloudflare since CF does not proxy UDP.
  # denied-peer-ip blocks relay to RFC-1918 ranges (SSRF guard).
  # ==========================================================
  coturn:
    profiles: [talk, coturn]
    image: coturn/coturn:${COTURN_VERSION:-4.10.0-r1}
    container_name: coturn
    network_mode: host
    volumes:
      - ${DOCK_CONF}/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    mem_limit: ${COTURN_MEM_LIMIT:-256m}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3478"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  # ==========================================================
  # nextcloud-spreed-signaling — Nextcloud Talk High-Performance Backend.
  # WebSocket signaling server; NOT behind Authentik (Talk clients connect
  # directly — browser-mediated auth would break the WebSocket handshake).
  # Talks to janus over the talk network for WebRTC media coordination.
  # Validates Nextcloud tokens by calling http://nextcloud/ on the talk network.
  # ==========================================================
  spreed-signaling:
    profiles: [talk, spreed-signaling]
    image: strukturag/nextcloud-spreed-signaling:${SPREED_SIGNALING_VERSION:-latest}
    container_name: spreed-signaling
    depends_on:
      nextcloud:
        condition: service_healthy
      janus:
        condition: service_healthy
    volumes:
      - ${DOCK_CONF}/spreed-signaling/server.conf:/config/server.conf:ro
    networks:
      cloud:
        ipv4_address: 192.0.2.10
    mem_limit: ${SPREED_SIGNALING_MEM_LIMIT:-256m}
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/v1/stats"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  # ==========================================================
  # janus — WebRTC media server for Nextcloud Talk HPB.
  # Service name "janus" must match the URL in server.conf [janus].
  # RTP media ports 20000-20100/udp published to host so WebRTC
  # peers can reach them directly (Cloudflare does not proxy UDP).
  # Admin API on 8188 is routed via Caddy at example.com,
  # gated by Authentik. Internal API on 8088 is talk-network only.
  # nat_1_1_mapping in janus.jcfg must be set to the host public IP.
  # ==========================================================
  janus:
    profiles: [talk, janus]
    image: ${JANUS_IMAGE:-meetecho/janus-gateway:latest}
    container_name: janus-gateway
    volumes:
      - ${DOCK_CONF}/janus/janus.jcfg:/usr/local/etc/janus/janus.jcfg:ro
      - ${DOCK_CONF}/janus/janus.transport.http.jcfg:/usr/local/etc/janus/janus.transport.http.jcfg:ro
    ports:
      - "20000-20100:20000-20100/udp"
    networks:
      cloud:
        ipv4_address: 192.0.2.10
    mem_limit: ${JANUS_MEM_LIMIT:-512m}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # canyan/janus-gateway has no wget/curl; check HTTP port via /proc/net/tcp6 (hex 1F98 = 8088).
      test: ["CMD-SHELL", "grep -q '1F98' /proc/net/tcp6 || grep -q '1F98' /proc/net/tcp"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  # ==========================================================
  # MEDIA STACK — optional, profile-gated.
  # Enable:  docker compose --profile media up -d
  # Disable: docker compose --profile media down
  #
  # All outbound requests from every media service pass through
  # ProtonVPN WireGuard via GlueTUN. Services share GlueTUN's
  # network namespace (network_mode: service:gluetun) — Caddy
  # reaches them by name "gluetun:<port>" on the apps network.
  # FlareSolverr is internal-only (Prowlarr → localhost:8191).
  # ==========================================================

  gluetun:
    profiles: [vpn, gluetun]
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${PROTONVPN_WIREGUARD_PRIVATE_KEY}
      SERVER_COUNTRIES: ${PROTONVPN_SERVER_COUNTRIES:-Netherlands}
      VPN_PORT_FORWARDING: ${PROTONVPN_PORT_FORWARDING:-off}
      # When a port is forwarded, wait 60 s for qBittorrent to be ready then
      # push the new listen port to its API. {{FORWARDED_PORT}} is substituted
      # by Gluetun before sh runs — no shell variable needed. Local auth bypass
      # must be enabled in qBittorrent.conf (seeded by docker-host-config.sh).
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        sleep 60 &&
        wget -q -T5 -O/dev/null
        --post-data=json=%7B%22listen_port%22:{{FORWARDED_PORT}}%7D
        http://localhost:${QBIT_WEBUI_PORT:-8080}/api/v2/app/setPreferences
      UPDATER_PERIOD: 24h
      # DOT off: keep Docker's embedded resolver so container names resolve.
      DOT: "off"
      # Allow direct traffic to Docker subnets without going through VPN.
      FIREWALL_OUTBOUND_SUBNETS: 192.0.2.10/8
    networks:
      media:
        ipv4_address: 192.0.2.10
    mem_limit: ${GLUETUN_MEM_LIMIT:-256m}
    security_opt:
      - no-new-privileges:true
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  prowlarr:
    profiles: [video, prowlarr]
    image: lscr.io/linuxserver/prowlarr:${PROWLARR_VERSION:-2.3.5.5327-ls144}
    container_name: prowlarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${DOCK_CONF}/prowlarr:/config
    mem_limit: ${PROWLARR_MEM_LIMIT:-512m}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null -w '%{http_code}' http://localhost:9696/ | grep -qvE '^(000|5[0-9]{2})$'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  radarr:
    profiles: [video, radarr]
    image: lscr.io/linuxserver/radarr:${RADARR_VERSION:-6.1.1.10360-ls300}
    container_name: radarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${DOCK_CONF}/radarr:/config
      - ${MEDIA_PATH}:/media
      - ${DOWNLOADS_PATH}:/downloads
    mem_limit: ${RADARR_MEM_LIMIT:-512m}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null -w '%{http_code}' http://localhost:7878/ | grep -qvE '^(000|5[0-9]{2})$'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  sonarr:
    profiles: [video, sonarr]
    image: lscr.io/linuxserver/sonarr:${SONARR_VERSION:-4.0.17.2952-ls309}
    container_name: sonarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${DOCK_CONF}/sonarr:/config
      - ${MEDIA_PATH}:/media
      - ${DOWNLOADS_PATH}:/downloads
    mem_limit: ${SONARR_MEM_LIMIT:-512m}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null -w '%{http_code}' http://localhost:8989/ | grep -qvE '^(000|5[0-9]{2})$'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  lidarr:
    profiles: [audio, lidarr]
    image: lscr.io/linuxserver/lidarr:${LIDARR_VERSION:-3.1.0.4875-ls26}
    container_name: lidarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${DOCK_CONF}/lidarr:/config
      - ${MEDIA_PATH}:/media
      - ${DOWNLOADS_PATH}:/downloads
    mem_limit: ${LIDARR_MEM_LIMIT:-512m}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null -w '%{http_code}' http://localhost:8686/ | grep -qvE '^(000|5[0-9]{2})$'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  flaresolverr:
    profiles: [captcha, flaresolverr]
    image: ghcr.io/flaresolverr/flaresolverr:${FLARESOLVERR_VERSION:-v3.4.6}
    container_name: flaresolverr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      LOG_LEVEL: info
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      TZ: ${TZ}
    mem_limit: ${FLARESOLVERR_MEM_LIMIT:-512m}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8191/health | grep -q '\"ok\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  qbittorrent:
    profiles: [downloads, qbittorrent]
    image: lscr.io/linuxserver/qbittorrent:${QBITTORRENT_VERSION:-5.1.4-r3-ls452}
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: ${QBIT_WEBUI_PORT:-8080}
    volumes:
      - ${DOCK_CONF}/qbittorrent:/config
      - ${DOWNLOADS_PATH}:/downloads
    mem_limit: ${QBIT_MEM_LIMIT:-1g}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null -w '%{http_code}' http://localhost:${QBIT_WEBUI_PORT:-8080}/ | grep -qvE '^(000|5[0-9]{2})$'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  # ==========================================================
  # Jellyfin — media server. Profile: media.
  # GPU transcoding via /dev/dri. Not behind VPN — accessed
  # directly by LAN/Tailnet clients.
  # ==========================================================
  jellyfin:
    profiles: [stream, jellyfin]
    image: lscr.io/linuxserver/jellyfin:${JELLYFIN_VERSION:-10.11.8ubu2404-ls30}
    container_name: jellyfin
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      JELLYFIN_PublishedServerUrl: https://${JELLYFIN_SUBDOMAIN:-jellyfin}.${PUBLIC_FQDN}
    volumes:
      - ${DOCK_CONF}/jellyfin:/config
      - ${MEDIA_PATH}:/media:ro
    devices:
      - /dev/dri:/dev/dri
    networks:
      media:
        ipv4_address: 192.0.2.10
      oidc-clients:
        ipv4_address: 192.0.2.10
    mem_limit: ${JELLYFIN_MEM_LIMIT:-4g}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8096/health | grep -q Healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  # ==========================================================
  # Jellyseerr — media request management for Jellyfin.
  # Profile: media. Talks to Sonarr/Radarr via gluetun netns.
  # ==========================================================
  jellyseerr:
    profiles: [requests, jellyseerr]
    image: fallenbagel/jellyseerr:${JELLYSEERR_VERSION:-latest}
    container_name: jellyseerr
    depends_on:
      jellyfin:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    volumes:
      - ${DOCK_CONF}/jellyseerr:/app/config
    networks:
      media:
        ipv4_address: 192.0.2.10
    mem_limit: ${JELLYSEERR_MEM_LIMIT:-512m}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5055/api/v1/status | grep -q version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  # ==========================================================
  # PRODUCTIVITY STACK — optional, profile-gated.
  # Enable:  docker compose --profile apps up -d
  # Disable: docker compose --profile apps down
  #
  # Services: ntfy (push notifications), Tandoor (recipes),
  # Vikunja (task management), AFFiNE (collaborative workspace).
  # ntfy and Vikunja skip forward-auth (API clients / mobile app).
  # ==========================================================

  ntfy:
    profiles: [notify, ntfy]
    image: binwiederhier/ntfy:${NTFY_VERSION:-latest}
    container_name: ntfy
    command: serve
    environment:
      TZ: ${TZ}
      NTFY_BASE_URL: https://${NTFY_SUBDOMAIN:-ping}.${PUBLIC_FQDN}
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_LOG_LEVEL: info
    volumes:
      - ${DOCK_CONF}/ntfy:/etc/ntfy
      - ${DOCK_DATA}/ntfy/cache:/var/cache/ntfy
      - ${DOCK_DATA}/ntfy/data:/var/lib/ntfy
    networks:
      apps:
        ipv4_address: 192.0.2.10
      security:
        ipv4_address: 192.0.2.10
    mem_limit: ${NTFY_MEM_LIMIT:-256m}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/v1/health | grep -q healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  # ==========================================================
  # Tandoor — recipe management. Needs SECRET_KEY (gen-secrets).
  # Auth: native OIDC via Authentik — Django allauth reads
  # SOCIAL_PROVIDERS + SOCIALACCOUNT_PROVIDERS at startup.
  # No Caddy forward-auth; Tandoor owns its own login page.
  # Runs as uid 1000. Database migrations run on startup.
  # ==========================================================
  tandoor:
    profiles: [recipes, tandoor]
    image: vabene1111/recipes:${TANDOOR_VERSION:-latest}
    container_name: tandoor
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_ENGINE: django.db.backends.postgresql
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${TANDOOR_DB_NAME}
      POSTGRES_USER: ${TANDOOR_DB_USER}
      POSTGRES_PASSWORD: ${TANDOOR_DB_PASSWORD}
      SECRET_KEY: ${TANDOOR_SECRET_KEY}
      ALLOWED_HOSTS: ${TANDOOR_SUBDOMAIN:-food}.${PUBLIC_FQDN},${TANDOOR_SUBDOMAIN:-food}.${TAILNET_FQDN},tandoor
      GUNICORN_MEDIA: "0"
      FRACTION_PREF_DEFAULT: "0"
      COMMENT_PREF_DEFAULT: "1"
      SHOPPING_MIN_AUTOSYNC_INTERVAL: "5"
      TZ: ${TZ}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USERNAME: "default"
      REDIS_DB: ${REDIS_DB_TANDOOR}
      # OIDC — Django allauth reads these natively at startup.
      # The provider id "authentik" fixes the callback path to
      # /accounts/oidc/authentik/login/callback/ — match this in Authentik.
      SOCIAL_PROVIDERS: allauth.socialaccount.providers.openid_connect
      SOCIALACCOUNT_PROVIDERS: >-
        {"openid_connect":{"SERVERS":[{"id":"authentik","name":"${TANDOOR_OIDC_PROVIDER_NAME:-authentik}","server_url":"${TANDOOR_OIDC_DISCOVERY_URL:-}","APP":{"client_id":"${TANDOOR_OIDC_CLIENT_ID:-}","secret":"${TANDOOR_OIDC_CLIENT_SECRET:-}"}}]}}
    volumes:
      - ${DOCK_DATA}/tandoor/media:/opt/recipes/mediafiles
      - ${DOCK_DATA}/tandoor/static:/opt/recipes/staticfiles
    networks:
      apps:
        ipv4_address: 192.0.2.10
      data:
      oidc-clients:
        ipv4_address: 192.0.2.10
    mem_limit: ${TANDOOR_MEM_LIMIT:-512m}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Host: tandoor' http://localhost/ | grep -qi tandoor"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 200s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  # ==========================================================
  # Vikunja — task/project management (Todoist alternative).
  # Auth: native OIDC via Authentik — env vars below wire it up
  # at startup. No Caddy forward-auth; Vikunja owns its login.
  # JWT_SECRET generated by gen-secrets.sh.
  # ==========================================================
  vikunja:
    profiles: [tasks, vikunja]
    image: vikunja/vikunja:${VIKUNJA_VERSION:-latest}
    container_name: vikunja
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: postgres
      VIKUNJA_DATABASE_DATABASE: ${VIKUNJA_DB_NAME}
      VIKUNJA_DATABASE_USER: ${VIKUNJA_DB_USER}
      VIKUNJA_DATABASE_PASSWORD: ${VIKUNJA_DB_PASSWORD}
      VIKUNJA_SERVICE_JWTSECRET: ${VIKUNJA_JWT_SECRET}
      VIKUNJA_SERVICE_PUBLICURL: https://${VIKUNJA_SUBDOMAIN:-tasks}.${PUBLIC_FQDN}/
      VIKUNJA_SERVICE_TIMEZONE: ${TZ}
      VIKUNJA_LOG_LEVEL: info
      VIKUNJA_KEYVALUE_TYPE: memory
      VIKUNJA_REDIS_HOST: redis
      VIKUNJA_REDIS_PORT: "6379"
      VIKUNJA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      VIKUNJA_REDIS_DB: ${REDIS_DB_VIKUNJA}
      # OIDC — Vikunja reads these natively at startup. The provider key
      # "AUTHENTIK" determines the redirect URI path segment (/auth/openid/authentik).
      VIKUNJA_AUTH_OPENID_ENABLED: "true"
      VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_NAME: ${VIKUNJA_OIDC_PROVIDER_NAME:-authentik Login}
      VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_AUTHURL: ${VIKUNJA_OIDC_AUTH_URL:-}
      VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_CLIENTID: ${VIKUNJA_OIDC_CLIENT_ID:-}
      VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_CLIENTSECRET: ${VIKUNJA_OIDC_CLIENT_SECRET:-}
      VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_SCOPE: openid email profile
      VIKUNJA_AUTH_LOCAL_ENABLED: "${VIKUNJA_AUTH_LOCAL_ENABLED:-true}"
    volumes:
      - ${DOCK_DATA}/vikunja:/app/vikunja/files
    networks:
      apps:
        ipv4_address: 192.0.2.10
      data:
      oidc-clients:
        ipv4_address: 192.0.2.10
    mem_limit: ${VIKUNJA_MEM_LIMIT:-512m}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/app/vikunja/vikunja", "version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  # ==========================================================
  # AFFiNE — collaborative workspace (Notion alternative).
  # Auth: OIDC via Authentik configured in the AFFiNE admin panel
  # (Admin Panel → Settings → OAuth). No Caddy forward-auth.
  # AFFINE_SERVER_EXTERNAL_URL must match the public URL or
  # CORS/WebSocket connections will fail (editor won't load).
  # ==========================================================
  affine:
    profiles: [notes, affine]
    image: ghcr.io/toeverything/affine:${AFFINE_VERSION:-stable}
    container_name: affine
    depends_on:
      postgres:
        condition: service_healthy
      redis-affine:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${AFFINE_DB_USER}:${AFFINE_DB_PASSWORD}@postgres:5432/${AFFINE_DB_NAME}
      REDIS_SERVER_HOST: redis-affine
      REDIS_SERVER_PORT: "6379"
      AFFINE_SERVER_EXTERNAL_URL: https://${AFFINE_SUBDOMAIN:-affine}.${PUBLIC_FQDN}
      AFFINE_SERVER_HOST: "0.0.0.0"
      AFFINE_SERVER_PORT: "3010"
      NODE_ENV: production
      # OIDC — not consumed natively by AFFiNE; available as reference for the
      # JSON config entered in Admin Panel → Settings → OAuth → OIDC provider.
      AFFINE_OIDC_ISSUER: ${AFFINE_OIDC_ISSUER:-}
      AFFINE_OIDC_CLIENT_ID: ${AFFINE_OIDC_CLIENT_ID:-}
      AFFINE_OIDC_CLIENT_SECRET: ${AFFINE_OIDC_CLIENT_SECRET:-}
    volumes:
      - ${DOCK_DATA}/affine/config:/root/.affine/config
      - ${DOCK_DATA}/affine/storage:/root/.affine/storage
    networks:
      apps:
        ipv4_address: 192.0.2.10
      data:
      oidc-clients:
        ipv4_address: 192.0.2.10
    mem_limit: ${AFFINE_MEM_LIMIT:-2g}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3010',r=>{process.exit(r.statusCode<500?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  # ==========================================================
  # redis-affine — Dedicated Redis for AFFiNE.
  # AFFiNE requires noeviction policy (it uses Redis as a primary
  # key-value store, not a cache). The shared redis uses allkeys-lru
  # which causes AFFiNE to warn and potentially lose data under memory
  # pressure. Isolated to the apps network; no password needed.
  # ==========================================================
  redis-affine:
    profiles: [notes, redis-affine]
    image: redis:7-alpine
    container_name: redis-affine
    labels:
      - autoheal=true
    command:
      - redis-server
      - --maxmemory-policy
      - noeviction
      - --protected-mode
      - "no"
    networks:
      apps:
        ipv4_address: 192.0.2.10
    mem_limit: ${REDIS_AFFINE_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging

  # ==========================================================
  # Dockhand — container monitoring + management dashboard.
  # Gated by Authentik forward-auth.
  # Uses socket-proxy-rw for full container management.
  # ==========================================================
  dockhand:
    profiles: [container-mgmt, dockhand]
    image: fnsys/dockhand:latest
    container_name: dockhand
    depends_on:
      socket-proxy-rw:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://socket-proxy-rw:2375
      DATA_DIR: /app/data
      ENCRYPTION_KEY: ${DOCKHAND_ENCRYPTION_KEY}
    volumes:
      - ${DOCK_DATA}/dockhand:/app/data
    networks:
      security:
        ipv4_address: 192.0.2.10
    mem_limit: ${DOCKHAND_MEM_LIMIT:-256m}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  # ==========================================================
  # Falco Sidekick — receives Falco security events via HTTP and
  # forwards them to the UI dashboard. Falco must have http_output
  # pointing to http://falcosidekick:2801/ in falco.yaml.
  # Gates on Authentik forward-auth at sec.{PUBLIC_FQDN}.
  # ==========================================================
  falcosidekick:
    profiles: [runtime-sec, falcosidekick]
    image: falcosecurity/falcosidekick:latest
    container_name: falcosidekick
    depends_on:
      - falco
    environment:
      WEBUI_URL: https://${FALCO_SUBDOMAIN:-sec}.${PUBLIC_FQDN}
      KAFKA_HOSTPORT: redpanda:9092
      KAFKA_TOPIC: falco.alerts
      NTFY_HOSTPORT: "ntfy:80"
      NTFY_TOPIC: "falco"
      NTFY_CHECKCERT: "false"
      NTFY_MINIMUMPRIORITY: "warning"
    networks:
      security:
        ipv4_address: 192.0.2.10
      apps:
        ipv4_address: 192.0.2.10
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2801/healthz | grep -q ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  redis-falco:
    profiles: [runtime-sec, redis-falco]
    image: redis/redis-stack-server:latest
    container_name: redis-falco
    labels:
      - autoheal=true
    volumes:
      - ${DOCK_DATA}/redis-falco:/data
    networks:
      security:
        ipv4_address: 192.0.2.10
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  falcosidekick-ui:
    profiles: [runtime-sec, falcosidekick-ui]
    image: falcosecurity/falcosidekick-ui:latest
    container_name: falcosidekick-ui
    depends_on:
      falcosidekick:
        condition: service_started
      redis-falco:
        condition: service_healthy
    environment:
      SIDEKICK_URL: http://falcosidekick:2801
      FALCOSIDEKICK_UI_REDIS_URL: redis-falco:6379
      FALCOSIDEKICK_UI_DISABLEAUTH: "true"
    networks:
      security:
        ipv4_address: 192.0.2.10
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2802/ | grep -q html"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  # ==========================================================
  # Zeek log browser — filebrowser serving Zeek TSV log files
  # at net.{PUBLIC_FQDN}. Auth disabled (Authentik gates it).
  # Runs as svc-user:media (1010:1010) so it can traverse /dock/conf/zeek/logs
  # which is owned 1010:1010 mode 770. Database is persisted to /dock/data/zeek-logs.
  # ==========================================================
  zeek-logs:
    profiles: [netmon, zeek-logs]
    image: filebrowser/filebrowser:${FILEBROWSER_VERSION:-v2.63.2}
    container_name: zeek-logs
    user: "1010:1010"
    command: ["--noauth", "--root", "/srv", "--port", "80"]
    volumes:
      - ${DOCK_CONF}/zeek/logs:/srv:ro
      - ${DOCK_DATA}/zeek-logs:/database
    networks:
      security:
        ipv4_address: 192.0.2.10
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ | grep -q html"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  # ==========================================================
  # Redpanda — Kafka-protocol message broker for security events.
  # Falcosidekick publishes to falco.alerts; n8n consumes from it.
  # redpanda-init (one-shot) creates topics with retention settings.
  # redpanda-console exposes a read-only topic inspector at
  # kafka-console.{PUBLIC_FQDN}, gated by Authentik forward-auth.
  # Prometheus metrics: http://redpanda:9644/public_metrics
  # ==========================================================
  redpanda:
    profiles: [streaming, redpanda]
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda
      - start
      - --mode dev-container
      - --smp 1
      - --memory 400M
      - --reserve-memory 0M
      - --default-log-level=info
      - --kafka-addr internal://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:9092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
    volumes:
      - ${DOCK_DATA}/redpanda:/var/lib/redpanda/data
    networks:
      security:
        ipv4_address: 192.0.2.10
    mem_limit: 512m
    cpus: 1
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9644/v1/cluster/health_overview"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  redpanda-init:
    profiles: [streaming, redpanda-init]
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        rpk topic create falco.alerts falco.alerts.dlq
        --brokers redpanda:9092
        --topic-config retention.ms=604800000
        --topic-config retention.bytes=1073741824
        --if-not-exists
    networks:
      security:
    restart: "no"
    logging: *default-logging

  redpanda-console:
    profiles: [streaming, redpanda-console]
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "false"
    networks:
      security:
        ipv4_address: 192.0.2.10
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  # ==========================================================
  # Immich — self-hosted photo + video library.
  # No forward-auth: mobile apps (iOS/Android) authenticate via
  # Immich's own API key — forward-auth would break them.
  # immich-server: main API + web UI (port 2283)
  # immich-machine-learning: face recognition + CLIP search
  # ==========================================================
  immich-server:
    profiles: [photos, immich-server]
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v2.7.5}
    container_name: immich-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOSTNAME: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${IMMICH_DB_USER}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: ${IMMICH_DB_NAME}
      REDIS_HOSTNAME: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: "6379"
      REDIS_DBINDEX: ${REDIS_DB_IMMICH:-4}
      IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
    volumes:
      - ${DOCK_DATA}/immich/upload:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    networks:
      apps:
        ipv4_address: 192.0.2.10
      data:
      oidc-clients:
        ipv4_address: 192.0.2.10
    mem_limit: ${IMMICH_SERVER_MEM_LIMIT:-2g}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2283/api/server/ping | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  immich-machine-learning:
    profiles: [photos, immich-machine-learning]
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v2.7.5}
    container_name: immich-machine-learning
    volumes:
      - ${DOCK_DATA}/immich/model-cache:/cache
    networks:
      - apps
    mem_limit: ${IMMICH_ML_MEM_LIMIT:-2g}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3003/ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  # ==========================================================
  # n8n — workflow automation. Profile: apps.
  # Gated by Authentik forward-auth. Uses Postgres only.
  # N8N_ENCRYPTION_KEY is immutable after first run — changing it
  # breaks all stored credentials. gen-secrets.sh never overwrites it.
  # ==========================================================
  n8n:
    profiles: [automation, n8n]
    # Pinned (was :latest): an unpinned latest shipped a node binary with a
    # libstdc++ ABI mismatch ("Error relocating /usr/local/bin/node: symbol
    # not found", exit 127) that crash-looped 2000+ times. Pin a known-good
    # version; bump N8N_VERSION in .env after testing a new release.
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.21.7}
    container_name: n8n
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_HOST: ${N8N_SUBDOMAIN:-soar}.${PUBLIC_FQDN}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_SUBDOMAIN:-soar}.${PUBLIC_FQDN}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${TZ}
      N8N_TRUST_PROXY: "true"
    volumes:
      - ${DOCK_DATA}/n8n:/home/node/.n8n
    networks:
      apps:
        ipv4_address: 192.0.2.10
      data:
      security:
        ipv4_address: 192.0.2.10
    mem_limit: ${N8N_MEM_LIMIT:-1g}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz | grep -q ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  # ==========================================================
  # Dashy — home launcher served at the apex example.com domain.
  # Config at ${DOCK_CONF}/dashy/conf.yml — regenerate with:
  #   python3 scripts/gen-dashy-config.py
  # Docs: https://dashy.to/docs
  # ==========================================================
  dashy:
    profiles: [home, dashy]
    image: lissy93/dashy:${DASHY_VERSION:-latest}
    container_name: dashy
    volumes:
      - ${DOCK_CONF}/dashy:/app/user-data
    environment:
      NODE_ENV: production
    networks:
      apps:
        ipv4_address: 192.0.2.10
    mem_limit: ${DASHY_MEM_LIMIT:-256m}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qSO /dev/null http://127.0.0.1:8080/ 2>&1 | grep -q '200'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  # ==========================================================
  # ClickHouse — columnar OLAP store for security analytics.
  # Schema: templates/clickhouse/init/ (auto-loaded on first start)
  # Native protocol: 9000 (Vector sink), HTTP: 8123 (Grafana plugin)
  # ==========================================================
  clickhouse:
    profiles: [analytics, clickhouse]
    image: clickhouse/clickhouse-server:24-alpine
    container_name: clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: your-org
      CLICKHOUSE_USER: your-org
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ${DOCK_DATA}/clickhouse:/var/lib/clickhouse
      - ${DOCK_CONF}/clickhouse/init:/docker-entrypoint-initdb.d:ro
    networks:
      security:
        ipv4_address: 192.0.2.10
      monitoring:
        ipv4_address: 192.0.2.10
    mem_limit: ${CLICKHOUSE_MEM_LIMIT:-4g}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - autoheal=true
    logging: *default-logging

  # ==========================================================
  # Vector — log ingestion agent: Caddy access + Coraza → ClickHouse
  # Config: templates/vector/vector.toml (mounted read-only)
  # ==========================================================
  vector:
    profiles: [analytics, vector]
    image: timberio/vector:latest-alpine
    container_name: vector
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.toml"]
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_VECTOR_PASSWORD: ${CLICKHOUSE_VECTOR_PASSWORD}
    volumes:
      - ${DOCK_CONF}/vector/vector.toml:/etc/vector/vector.toml:ro
      - ${DOCK_CONF}/caddy/logs:/var/log/caddy:ro
      - ${DOCK_DATA}/vector:/var/lib/vector
    networks:
      security:
        ipv4_address: 192.0.2.10
    mem_limit: ${VECTOR_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8686/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  # ==========================================================
  # Grafana — metrics visualization + health monitoring dashboards.
  # SSO via Authentik header proxy (X-Authentik-Username).
  # Provisioning: ${DOCK_CONF}/grafana/provisioning/
  # Docs: https://grafana.com/docs/grafana/latest
  # ==========================================================
  grafana:
    profiles: [viz, grafana]
    image: grafana/grafana-oss:${GRAFANA_VERSION:-latest}
    container_name: grafana
    depends_on:
      prometheus:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      GF_INSTALL_PLUGINS: "grafana-clickhouse-datasource"
      GF_SERVER_ROOT_URL: https://${GRAFANA_SUBDOMAIN:-dash}.${PUBLIC_FQDN}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_USER: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # SSO-only: hide the local user/pass form; auth comes from Authentik via
      # the auth-proxy header below. Break-glass: set "false" + recreate, or use
      # the Tailnet URL. See docs/runbooks/local-login-recovery.md.
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-Authentik-Username
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ${DOCK_DATA}/grafana:/var/lib/grafana
      - ${DOCK_CONF}/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      monitoring:
        ipv4_address: 192.0.2.10
      apps:
        ipv4_address: 192.0.2.10
    mem_limit: ${GRAFANA_MEM_LIMIT:-512m}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q database"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  # ==========================================================
  # Prometheus — metrics collection, storage, and querying.
  # Config: ${DOCK_CONF}/prometheus/prometheus.yml
  # 30-day retention (~5-10 GB); set PROMETHEUS_RETENTION to override.
  # Docs: https://prometheus.io/docs
  # ==========================================================
  prometheus:
    profiles: [metrics, prometheus]
    image: prom/prometheus:${PROMETHEUS_VERSION:-latest}
    container_name: prometheus
    labels:
      - autoheal=true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-admin-api
      - --web.enable-lifecycle
    volumes:
      - ${DOCK_CONF}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${DOCK_CONF}/prometheus/alerts:/etc/prometheus/alerts:ro
      - ${DOCK_DATA}/prometheus:/prometheus
    networks:
      monitoring:
        ipv4_address: 192.0.2.10
      security:
        ipv4_address: 192.0.2.10
      ingress:
        ipv4_address: 192.0.2.10
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-1g}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy | grep -q Healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  # ==========================================================
  # cAdvisor — per-container CPU, memory, network metrics.
  # Privileged: required to read cgroup and /sys data.
  # Docs: https://github.com/google/cadvisor
  # ==========================================================
  cadvisor:
    profiles: [exporters, cadvisor]
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    labels:
      - autoheal=true
    privileged: true
    # --docker_only: report only docker containers (+ root), via the docker
    # factory, so metrics carry the friendly name="<container>" label. Without
    # it, on cgroup v2 the systemd/raw-cgroup view claims /system.slice/
    # docker-*.scope first and emits only the opaque cgroup `id`, breaking
    # per-container dashboards. (Appended to the image entrypoint; containerd
    # stays at its default socket — the docker factory depends on it.)
    command:
      - --docker_only=true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      monitoring:
        ipv4_address: 192.0.2.10
    mem_limit: ${CADVISOR_MEM_LIMIT:-256m}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz | grep -q ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  # ==========================================================
  # Node Exporter — host hardware and OS metrics.
  # pid: host + proc bind mounts required for real CPU/memory data.
  # Docs: https://github.com/prometheus/node_exporter
  # ==========================================================
  node-exporter:
    profiles: [exporters, node-exporter]
    image: prom/node-exporter:latest
    container_name: node-exporter
    labels:
      - autoheal=true
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      monitoring:
        ipv4_address: 192.0.2.10
    mem_limit: ${NODE_EXPORTER_MEM_LIMIT:-128m}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

  # ==========================================================
  # PostgreSQL Exporter — database metrics for Prometheus.
  # Docs: https://github.com/prometheus-community/postgres_exporter
  # ==========================================================
  postgres-exporter:
    profiles: [exporters, postgres-exporter]
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    labels:
      - autoheal=true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_SUPERUSER:-postgres}:${POSTGRES_SUPERUSER_PASSWORD}@postgres:5432/postgres?sslmode=disable"
    networks:
      monitoring:
        ipv4_address: 192.0.2.10
      data:
        ipv4_address: 192.0.2.10
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9187/metrics | grep -q pg_up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  # ==========================================================
  # Redis Exporter — Redis metrics for Prometheus.
  # Docs: https://github.com/oliver006/redis_exporter
  # ==========================================================
  redis-exporter:
    profiles: [exporters, redis-exporter]
    image: oliver006/redis_exporter:${REDIS_EXPORTER_VERSION:-v1.83.0}
    container_name: redis-exporter
    labels:
      - autoheal=true
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    networks:
      monitoring:
        ipv4_address: 192.0.2.10
      data:
        ipv4_address: 192.0.2.10
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # Distroless/scratch image — no shell or utilities available.
      # Health is monitored via Prometheus scraping instead.
      disable: true
    restart: unless-stopped
    logging: *default-logging

  # ==========================================================
  # Alertmanager — routes Prometheus alerts to ntfy (push).
  # Receives alerts from Prometheus on port 9093 and forwards
  # them as webhooks to ntfy for push notification delivery.
  # SETUP: after first deploy, run:
  #   docker exec ntfy ntfy access '*' alerts write-only
  # Docs: https://prometheus.io/docs/alerting/latest/alertmanager/
  # ==========================================================
  alertmanager:
    profiles: [metrics, alertmanager]
    image: prom/alertmanager:${ALERTMANAGER_VERSION:-v0.28.0}
    container_name: alertmanager
    depends_on:
      prometheus:
        condition: service_healthy
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    volumes:
      - ${DOCK_CONF}/alertmanager:/etc/alertmanager:ro
      - ${DOCK_DATA}/alertmanager:/alertmanager
    networks:
      monitoring:
        ipv4_address: 192.0.2.10
      apps:
        ipv4_address: 192.0.2.10
    mem_limit: ${ALERTMANAGER_MEM_LIMIT:-128m}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/-/healthy | grep -qi ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  # ==========================================================
  # Loki — log aggregation and storage backend.
  # Logs are collected by Alloy and queryable in Grafana.
  # Retention: 30d, enforced by compactor.
  # Config: ${DOCK_CONF}/loki/loki.yml
  # Docs: https://grafana.com/docs/loki/latest/
  # ==========================================================
  loki:
    profiles: [logs, loki]
    image: grafana/loki:${LOKI_VERSION:-3.5.0}
    container_name: loki
    command: -config.file=/etc/loki/loki.yml
    user: "10001:10001"
    volumes:
      - ${DOCK_CONF}/loki/loki.yml:/etc/loki/loki.yml:ro
      - ${DOCK_DATA}/loki:/loki
    networks:
      monitoring:
        ipv4_address: 192.0.2.10
    mem_limit: ${LOKI_MEM_LIMIT:-512m}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging

  # ==========================================================
  # Alloy — log collection agent (Grafana's Prometheus Agent
  # successor). Discovers all Docker containers via the socket
  # and tails their logs to Loki.
  # ${DOCKER_GID}: GID of the host 'docker' group — set by gen-secrets.py so the
  # correct GID is captured at setup time regardless of distro or installer.
  # Config: ${DOCK_CONF}/alloy/config.alloy
  # Docs: https://grafana.com/docs/alloy/latest/
  # ==========================================================
  alloy:
    profiles: [logs, alloy]
    image: grafana/alloy:${ALLOY_VERSION:-v1.9.1}
    container_name: alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    user: "473:473"
    group_add:
      - "${DOCKER_GID:-983}"
    volumes:
      - ${DOCK_CONF}/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # check-versions.py writes image-update JSONL here; Alloy tails it → Loki.
      - ${DOCK_CONF}/version-check:/var/log/version-check:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      monitoring:
        ipv4_address: 192.0.2.10
    mem_limit: ${ALLOY_MEM_LIMIT:-256m}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/12345' 2>/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging
