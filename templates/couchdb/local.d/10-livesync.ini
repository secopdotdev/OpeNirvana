; obsidian-livesync CouchDB config (single-node + CORS).
; Secrets (admin user/password) come from env via the official entrypoint, which
; writes its own docker.ini into this same local.d dir at boot — NOT this file.
; This file holds only non-secret tuning + CORS required by the livesync clients.
[couchdb]
single_node = true
max_document_size = 50000000

[chttpd]
require_valid_user = true
; Exempt ONLY /_up from the valid-user requirement so the container healthcheck
; (curl -sf http://localhost:5984/_up) gets 200 instead of 401 — without this the
; container never reports healthy and compose up --wait rolls the deploy back.
; All data endpoints still require a valid user.
require_valid_user_except_for_up = true
max_http_request_size = 4294967296

[chttpd_auth]
require_valid_user = true

[httpd]
enable_cors = true

[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
