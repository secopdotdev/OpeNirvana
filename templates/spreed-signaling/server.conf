# nextcloud-spreed-signaling — High-Performance Backend signaling server.
# Rendered from templates/ by docker-host-config.sh configure_hpb().
# Edit templates/spreed-signaling/server.conf, then re-run docker-host-config.sh.

[http]
listen = 0.0.0.0:8080

[app]
# debug = true

[sessions]
# 64 hex chars used as raw HMAC-SHA256 key bytes — any length is valid.
# Generated by gen-secrets.sh — do not change after first run.
hashkey = ${NC_HPB_HASH_KEY}
# Exactly 32 printable chars (32 bytes) for AES-256 session encryption.
# Must NOT be hex-encoded — spreed-signaling uses the raw string as key bytes.
blockkey = ${NC_HPB_BLOCK_KEY}

[backend]
# Only listed Nextcloud instances may use this signaling server.
allowall = false
# Internal URL — signaling and nextcloud share the talk network.
urls = http://nextcloud/
# Must match the secret entered in Nextcloud Talk → High-performance backend settings.
secrets = ${NC_HPB_SHARED_SECRET}

[nats]
# nats://loopback starts an embedded NATS server; no sidecar required.
url = nats://loopback

[mcu]
type = janus
# Internal WebSocket URL — signaling and janus share the talk network.
url = ws://janus:8188
