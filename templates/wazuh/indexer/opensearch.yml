network.host: "0.0.0.0"
cluster.name: "wazuh-cluster"
node.name: ${NODE_NAME}
path.data: /var/lib/wazuh-indexer
path.logs: /var/log/wazuh-indexer

# node.name is resolved from the NODE_NAME env var via OpenSearch's ${VAR}
# substitution so the three indexers can share this file.
discovery.seed_hosts:
  - wazuh-indexer-1
  - wazuh-indexer-2
  - wazuh-indexer-3
cluster.initial_cluster_manager_nodes:
  - wazuh-indexer-1
  - wazuh-indexer-2
  - wazuh-indexer-3

# Certs live inside path.home so the JVM security policy grants read access.
# wazuh-init generates them on first boot. A single indexer cert with all three
# node hostnames/IPs as SANs is shared across the cluster; nodes_dn lists the
# one shared CN.
plugins.security.ssl.http.pemcert_filepath: /usr/share/wazuh-indexer/certs/indexer.pem
plugins.security.ssl.http.pemkey_filepath: /usr/share/wazuh-indexer/certs/indexer-key.pem
plugins.security.ssl.http.pemtrustedcas_filepath: /usr/share/wazuh-indexer/certs/root-ca.pem
plugins.security.ssl.transport.pemcert_filepath: /usr/share/wazuh-indexer/certs/indexer.pem
plugins.security.ssl.transport.pemkey_filepath: /usr/share/wazuh-indexer/certs/indexer-key.pem
plugins.security.ssl.transport.pemtrustedcas_filepath: /usr/share/wazuh-indexer/certs/root-ca.pem
plugins.security.ssl.http.enabled: true
plugins.security.ssl.transport.enforce_hostname_verification: false
plugins.security.ssl.transport.resolve_hostname: false

plugins.security.authcz.admin_dn:
  - "CN=admin,OU=Wazuh,O=Wazuh,L=California,C=US"
plugins.security.check_snapshot_restore_write_privileges: true
plugins.security.enable_snapshot_restore_privilege: true
plugins.security.nodes_dn:
  - "CN=wazuh-indexer,OU=Wazuh,O=Wazuh,L=California,C=US"
plugins.security.restapi.roles_enabled:
  - "all_access"
  - "security_rest_api_access"

plugins.security.system_indices.enabled: true
plugins.security.system_indices.indices: [".plugins-ml-model", ".plugins-ml-task", ".opendistro-alerting-config", ".opendistro-alerting-alert*", ".opendistro-anomaly-results*", ".opendistro-anomaly-detector*", ".opendistro-anomaly-checkpoints", ".opendistro-anomaly-detection-state", ".opendistro-reports-*", ".opensearch-notifications-*", ".opensearch-notebooks", ".opensearch-observability", ".opendistro-asynchronous-search-response*", ".replication-metadata-store"]

### Compatibility with Filebeat 7.10.2
compatibility.override_main_response_version: true
