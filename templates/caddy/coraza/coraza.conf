# Coraza core engine configuration — minimal, CRS provides the rules.
SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyInMemoryLimit 131072
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json
SecResponseBodyLimit 1048576
SecResponseBodyLimitAction Reject
SecAuditEngine RelevantOnly
# Coraza uses Go's RE2, which does not support Perl lookaheads. The upstream
# ModSecurity default `"^(?:5|4(?!04))"` (every 5xx + every 4xx except 404)
# is rewritten as an explicit alternation that RE2 accepts: all 5xx, plus
# 4xx codes excluding 404.
SecAuditLogRelevantStatus "^(5[0-9]{2}|4(0[0-35-9]|[1-9][0-9]))$"
SecAuditLogParts ABDEFHIJZ
SecAuditLog /var/log/caddy/coraza-audit.log
SecAuditLogFormat JSON
SecArgumentSeparator &
SecCookieFormat 0
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"
